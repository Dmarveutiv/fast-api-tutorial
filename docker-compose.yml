version: '3.8' 

volumes:
  postgres-db:

services:
  api:
    image: fastapi:latest
    ports:
      - "9000:9000"
    env_file:
      - ./.env


  postgres:
    image: postgres

    environment:
      - POSTGRES_PASSWORD=2005
      - POSTGRES_DB=fastapi

    env_file:
      - ./.env
    ports:
      - "5432:5432" 
    volumes:
      - postgres-db:/var/lib/postgresql

 
    
     